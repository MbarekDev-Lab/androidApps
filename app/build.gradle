 
plugins {
    alias(libs.plugins.androidApplication)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.plracticalcoding.myapplication'
    compileSdk 35

    defaultConfig {
        applicationId "com.plracticalcoding.myapplication"
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        baseline = file("lint-baseline.xml")
        ignore("UnusedResources")
    }
}
// Declare the version before the dependencies block
def lifecycle_version = "2.7.0"

dependencies {
    implementation 'org.mozilla:rhino:1.7.14'
    implementation(libs.core.ktx)
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.activity)
    implementation(libs.constraintlayout)
    implementation(libs.navigation.fragment)
    implementation(libs.navigation.ui)
    implementation(libs.firebase.database)
    implementation(libs.firebase.auth)
    implementation(libs.firebase.messaging)
    implementation libs.firebase.crashlytics.buildtools
    implementation libs.firebase.storage
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.viewpager2
    implementation libs.annotation
    implementation libs.lifecycle.livedata.ktx
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    implementation "com.google.android.gms:play-services-auth:21.4.0"

    // rest
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
   // implementation("com.squareup.retrofit2:retrofit:3.0.0")
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"

    // WorkManager — latest stable version as of 2025
    implementation "androidx.work:work-runtime:2.9.0"
    
    // Concurrent Futures for ListenableWorker
    implementation "androidx.concurrent:concurrent-futures:1.1.0"
    implementation 'com.squareup.picasso:picasso:2.8'

    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")


    implementation('com.yalantis:ucrop:2.2.0') {
        exclude group: 'com.android.support', module: 'support-compat'
    }
 }